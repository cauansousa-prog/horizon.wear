<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administração das lojas</title><link rel="stylesheet" href="/shared/loja-modelo.css"><script src="/shared/lojas-client.js" defer></script><script src="/central/admin.js" defer></script></head><body><header><strong>ADMINISTRAÇÃO</strong><a id="backStore" href="/lojas/academia/">Voltar à loja</a></header><main><h1>Sua loja.</h1><label>Loja<select id="store"><option value="academia">Academia</option><option value="construcao">Construção</option></select></label><form id="login"><h2>Entre para administrar</h2><label>E-mail<input name="email" type="email" autocomplete="email" required></label><label>Senha<input name="password" type="password" autocomplete="current-password" required minlength="8"></label><button>Entrar</button></form><p id="status" role="status"></p><section id="manage" hidden><button id="logout">Sair</button><h2>Produtos e opções</h2><form id="productForm"><label>Nome<input name="nome" required minlength="2" maxlength="120"></label><label>Identificador<input name="slug" required pattern="[a-z0-9]+(-[a-z0-9]+)*" placeholder="exemplo-produto" maxlength="100"></label><label>Descrição<textarea name="descricao" maxlength="2000"></textarea></label><label>Preço<input name="preco" type="number" min="0.01" step="0.01" required></label><label>Imagem<input name="imagem_url" placeholder="img/produto.jpg ou https://..." maxlength="2048"></label><label>Estoque<input name="estoque" type="number" min="0" step="1" value="0" required></label><label>Disponível<select name="ativo"><option value="true">Sim</option><option value="false">Não</option></select></label><button id="save">Salvar produto</button><button type="button" id="new">Novo produto</button></form><div id="products"></div></section></main></body></html>
