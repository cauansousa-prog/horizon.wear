<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Moda masculina, academia e construção em um só lugar."><title>Central — Escolha sua loja</title><link rel="stylesheet" href="/central/central.css"><script src="/central/central.js" defer></script></head>
<body>
<header class="central-header"><a class="central-brand" href="/central/" aria-label="Central — início"><span aria-hidden="true">✦</span> CENTRAL</a><button id="back" hidden>← Todas as lojas</button><nav id="storeNav" aria-label="Lojas" hidden><button data-store="horizon">Horizon Wear</button><button data-store="academia">Academia</button><button data-store="construcao">Construção</button></nav></header>
<main id="welcome"><div class="intro"><p class="eyebrow">SEU DIA. SUAS ESCOLHAS.</p><h1>Três lojas.<br><span>Um só lugar.</span></h1><p>Vista seu estilo, transforme sua rotina e tire seus projetos do papel.</p></div><section class="stores" aria-label="Escolha sua loja">

<section id="storeView" hidden aria-label="Loja selecionada"><p id="loadStatus" role="status">Abrindo a loja…</p><iframe id="storeFrame" title="Loja selecionada" referrerpolicy="same-origin"></iframe></section><p id="notice" class="notice" role="alert" hidden></p>
