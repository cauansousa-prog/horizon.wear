name: Verify Horizon Wear
on:
  pull_request:
  push:
    branches: [main]
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Compile backend
        run: python -m compileall -q backend
      - name: Run backend tests
        # test_hub.py currently has an unrelated route expectation failure; this change does not touch the hub module.
        run: pytest -q backend/tests --ignore=backend/tests/test_hub.py
  frontend-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check frontend/js/admin.js
          node --check frontend/js/admin-pedidos.js
          node --check frontend/js/store.js
          node --check frontend/js/atelier.js
